name: Update backlog data

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 06:30 KST Tue-Sat (after US filings of the prior day)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-backlog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data from SEC EDGAR
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/build_data.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/backlog.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update backlog data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
